# supabase/config.toml
# Empire Hub – Supabase project configuration
# Reference: https://supabase.com/docs/reference/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# port = 54325 (invalid key in config.toml root)
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# ── Note on Cron Jobs ──────────────────────────────────────
# Supabase Cron Jobs should be defined via SQL migrations using pg_cron.
# Example:
# SELECT cron.schedule('update-stock-prices', '*/5 * * * *', 'SELECT public.update_stock_prices()');
